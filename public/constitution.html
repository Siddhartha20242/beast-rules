<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beast Rules — Constitution</title>
  <style>
    :root { color-scheme: light dark; --paper: #fbf7ee; --ink: #23202b; --muted: #6c6578; --accent: #8a5a00; --rule: #d9cfb8; }
    @media (prefers-color-scheme: dark) { :root { --paper: #15162a; --ink: #eef0ff; --muted: #aab0d6; --accent: #ffd166; --rule: #343868; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 22px 80px; }
    h1 { font-size: clamp(28px, 6vw, 40px); text-align: center; margin: 0 0 8px; letter-spacing: .01em; }
    .preamble { text-align: center; font-style: italic; color: var(--muted); margin: 0 auto 28px; max-width: 560px; }
    .cover { text-align: center; padding: 36px 20px 34px; margin-bottom: 34px; border: 2px solid var(--rule); border-radius: 18px; background: linear-gradient(180deg, rgba(255, 209, 102, .10), transparent); }
    .cover .kicker { font: 700 12px/1 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
    .cover h1 { font-size: clamp(38px, 9vw, 64px); margin: 0 0 6px; }
    .cover .temperament { font: 600 16px/1.4 system-ui, sans-serif; color: var(--muted); margin-bottom: 18px; }
    .cover .ratified { font-style: italic; color: var(--muted); margin-bottom: 20px; }
    .integrity { max-width: 360px; margin: 0 auto; font: 600 13px/1.4 system-ui, sans-serif; color: var(--muted); }
    .integrity .track { height: 10px; border-radius: 99px; background: var(--rule); overflow: hidden; margin: 6px 0 4px; }
    .integrity .fill { height: 100%; background: var(--accent); width: 0; }
    .meta { text-align: center; color: var(--muted); font: 14px/1.4 system-ui, sans-serif; margin-bottom: 32px; }
    article { border-top: 1px solid var(--rule); padding: 18px 0; }
    article h2 { margin: 0 0 4px; font-size: 20px; }
    article h2 span { color: var(--accent); }
    article p { margin: 4px 0; }
    .byline { color: var(--muted); font: 13px/1.4 system-ui, sans-serif; }
    .status-repealed, .status-overruled { opacity: .62; }
    .status-repealed h2, .status-overruled h2 { text-decoration: line-through; text-decoration-thickness: 1px; }
    .badge { display: inline-block; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--rule); margin-left: 8px; vertical-align: 2px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    footer { text-align: center; color: var(--muted); font: 12px/1.4 system-ui, sans-serif; margin-top: 36px; }
    @media print { body { background: #fff; color: #000; } .badge { border-color: #999; } }
  </style>
</head>
<body>
  <main>
    <section class="cover" id="cover">
      <div class="kicker">Ratified by chat</div>
      <h1 id="title">Constitution</h1>
      <div class="temperament" id="cover-temperament"></div>
      <div class="ratified" id="cover-ratified"></div>
      <div class="integrity" id="cover-integrity" hidden>
        <div id="cover-integrity-label"></div>
        <div class="track"><div class="fill" id="cover-integrity-fill"></div></div>
        <div id="cover-integrity-detail"></div>
      </div>
    </section>
    <p class="preamble" id="preamble"></p>
    <div class="meta" id="meta"></div>
    <div id="articles"></div>
    <footer>Every article is written by chat. Names, dates and descriptions come only from validated law values.</footer>
  </main>
  <script>
    (async function load() {
      const articles = document.getElementById("articles");
      try {
        const doc = await (await fetch("/api/constitution")).json();
        document.title = `Beast Rules — ${doc.title}`;
        document.getElementById("title").textContent = doc.title;
        document.getElementById("preamble").textContent = doc.preamble;
        const cover = doc.cover || {};
        document.getElementById("cover-temperament").textContent = cover.temperament ? `Temperament: ${cover.temperament}` : "";
        document.getElementById("cover-ratified").textContent = cover.ratified_at
          ? `Ratified by chat on ${new Date(cover.ratified_at).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}`
          : "Not yet ratified. Chat has not written a law.";
        if (cover.integrity_percent !== null && cover.integrity_percent !== undefined) {
          document.getElementById("cover-integrity").hidden = false;
          document.getElementById("cover-integrity-label").textContent = `Integrity ${cover.integrity_percent}%`;
          document.getElementById("cover-integrity-fill").style.width = `${cover.integrity_percent}%`;
          document.getElementById("cover-integrity-detail").textContent = `${cover.laws_in_force} of ${cover.laws_written} laws still in force`;
        }
        const parts = [`${doc.summary.active} in force`, `${doc.summary.repealed} repealed`, `${doc.summary.overruled} overruled`];
        const scarTotal = Object.values(doc.scars || {}).reduce((sum, count) => sum + count, 0);
        if (scarTotal) parts.push(`${scarTotal} scar${scarTotal === 1 ? "" : "s"} on the beast`);
        document.getElementById("meta").textContent = parts.join(" · ");
        if (!doc.articles.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No laws have been written yet.";
          articles.append(empty);
          return;
        }
        for (const item of doc.articles) {
          const section = document.createElement("article");
          section.className = `status-${item.status}`;
          const heading = document.createElement("h2");
          const number = document.createElement("span");
          number.textContent = `Article ${item.number}. `;
          heading.append(number, document.createTextNode(item.title));
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = item.status;
          heading.append(badge);
          const text = document.createElement("p");
          text.textContent = item.text;
          const by = document.createElement("p");
          by.className = "byline";
          const enacted = new Date(item.enacted_at).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
          by.textContent = `${item.proposer ? `Proposed by ${item.proposer} · ` : ""}Enacted ${enacted} · Zone: ${item.zone}${item.note ? ` · ${item.note}` : ""}`;
          section.append(heading, text, by);
          articles.append(section);
        }
      } catch {
        const failed = document.createElement("p");
        failed.className = "empty";
        failed.textContent = "The constitution could not be loaded. Is the server running?";
        articles.append(failed);
      }
    })();
  </script>
</body>
</html>
